<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F172A">
<title>Portal administrativo — Electro Futuro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%2319C1D6'/><path d='M56 14 30 56h16l-4 30 28-44H54z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/portales.css">
</head>
<body>

<!-- ==================== INGRESO ==================== -->
<div class="acceso" id="acceso">
  <div class="acceso-caja">
    <img src="assets/img/marca/logo-nav.webp" alt="Electro Futuro">
    <h1>Portal administrativo</h1>
    <p>Entra con tu perfil. Cada uno ve una plataforma distinta: el comercial no ve costos, y bodega no ve precios de venta.</p>
    <div class="acceso-error" id="acceso-error"></div>
    <div class="campo">
      <label for="u">Usuario</label>
      <input type="text" id="u" autocomplete="username" autocapitalize="off" spellcheck="false" inputmode="text">
    </div>
    <div class="campo">
      <label for="c">Contraseña</label>
      <input type="password" id="c" autocomplete="current-password">
    </div>
    <button class="btn btn-p btn-bloque" id="entrar" style="padding:13px">Entrar</button>
    <div class="pistas">
      Perfiles: <code>c0m3rc14l</code> · <code>g3r3nc14</code> · <code>b0d3g4</code><br>
      La contraseña es igual al usuario.<br>
      <a href="index.html" style="color:var(--cyan-700);font-weight:600">Volver a la tienda</a>
    </div>
  </div>
</div>

<!-- ==================== APLICACIÓN ==================== -->
<div class="app" id="app">

  <aside class="lateral">
    <div class="lateral-marca">
      <img src="assets/img/marca/logo-nav.webp" alt="Electro Futuro">
      <span class="txt"><span class="perfil" id="perfil-etiqueta">—</span></span>
      <button class="plegar" id="plegar" aria-label="Plegar el menú" title="Plegar">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <nav class="menu" id="menu" aria-label="Módulos"></nav>
    <div class="lateral-pie">
      <a href="index.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16l-1 11H5z"/><path d="M8 9V6a4 4 0 0 1 8 0v3"/></svg>
        <span class="txt">Ver la tienda</span></a>
      <button class="salir" id="salir">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span class="txt">Cerrar sesión</span></button>
      <div class="tarjeta-usuario">
        <span class="avatar" id="u-inicial">—</span>
        <span class="txt"><b id="u-nombre">—</b><small id="u-rol">—</small></span>
      </div>
    </div>
  </aside>

  <main class="principal">
    <header class="barra">
      <div>
        <h1 id="titulo">Inicio</h1>
        <p class="sub" id="subtitulo">Resumen del día</p>
      </div>
      <span class="barra-espacio"></span>
      <div class="buscador-global">
        <span class="lupa"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
        <input type="search" id="buscar-global" placeholder="Pedido, SKU o cliente" aria-label="Buscador global">
        <kbd>Ctrl K</kbd>
      </div>
      <button class="icono-btn" id="campana" aria-label="Alertas" title="Alertas">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4a6 6 0 0 0-6 6c0 4-1.5 5.5-1.5 5.5h15S18 14 18 10a6 6 0 0 0-6-6z"/><path d="M10.3 19a2 2 0 0 0 3.4 0"/></svg>
        <span class="punto" id="campana-n" style="display:none">0</span>
      </button>
    </header>

    <div class="contenido">
      <section class="vista activa" id="v-inicio"></section>
      <section class="vista" id="v-pipeline"></section>
      <section class="vista" id="v-lineas"></section>
      <section class="vista" id="v-clientes"></section>
      <section class="vista" id="v-inventario"></section>
      <section class="vista" id="v-bodega"></section>
      <section class="vista" id="v-compras"></section>
      <section class="vista" id="v-cartera"></section>
      <section class="vista" id="v-finanzas"></section>
      <section class="vista" id="v-garantias"></section>
      <section class="vista" id="v-alertas"></section>
      <section class="vista" id="v-ajustes"></section>
    </div>
  </main>
</div>

<!-- ==================== PANEL DE DETALLE ==================== -->
<div class="velo" id="velo"></div>
<aside class="panel" id="panel" aria-label="Detalle">
  <div class="panel-cab">
    <div><h3 id="panel-titulo">Detalle</h3><p id="panel-sub"></p></div>
    <button class="cerrar-x" id="panel-cerrar" aria-label="Cerrar">×</button>
  </div>
  <div class="panel-cuerpo" id="panel-cuerpo"></div>
  <div class="panel-pie" id="panel-pie"></div>
</aside>

<div class="toast" id="toast"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/productos.js"></script>
<script src="assets/js/datos.js"></script>
<script src="assets/js/admin-ui.js"></script>
<script src="assets/js/admin-mod.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
